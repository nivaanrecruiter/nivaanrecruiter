<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form registration</title>
  </head>
  <body>
    <form
      name="job-application"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="job-application" />
      <input name="subject" />
      <input name="job-id" />
      <input name="job-title" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="linkedin" type="url" />
      <input name="cv" type="file" />
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="yes" />
      <input name="bot-field" />
    </form>
    <form
      name="hiring-request"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="hiring-request" />
      <input name="subject" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="role" />
      <input name="sector" />
      <input name="hire-type" />
      <input name="headcount" type="number" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
